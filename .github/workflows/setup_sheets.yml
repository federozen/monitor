name: Preparar hojas del monitor

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: setup-monitor-editorial
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vigia.txt
      - run: pip install -r requirements-vigia.txt
      - name: Crear y formatear hojas definitivas
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_PREFIX: ${{ vars.SHEET_PREFIX }}
          HIDE_TECHNICAL_SHEETS: ${{ vars.HIDE_TECHNICAL_SHEETS || 'true' }}
        run: python scripts/setup_sheets.py
